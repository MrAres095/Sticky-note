name: Android build check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/notebook-ui-server-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug
