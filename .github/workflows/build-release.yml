name: Build and release signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          python3 - <<'PY'
          import base64, os
          s = os.environ["KEYSTORE_B64"]
          s = "".join(s.split())
          # Normalize any existing padding before adding the exact required padding.
          s = s.rstrip("=")
          s += "=" * ((4 - len(s) % 4) % 4)
          raw = base64.b64decode(s, validate=True)
          if len(raw) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open(os.path.expanduser("~/.android/sticky-notes-release.jks"), "wb") as f:
              f.write(raw)
          print("Existing keystore decoded successfully:", len(raw), "bytes")
          PY

          echo "Checking existing release keystore..."
          STORE_PASSWORD="$KEYSTORE_PASSWORD"
          if ! keytool -list -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "Keystore password secret did not open the existing keystore; trying the configured key password as the keystore password."
            STORE_PASSWORD="$KEY_PASSWORD"
            keytool -list -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$STORE_PASSWORD" >/dev/null
          fi

          keytool -list -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Existing keystore: OK"
          echo "Alias: OK"

          cat > keystore.properties <<EOF
          storeFile=$HOME/.android/sticky-notes-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "### Signing: PERSISTENT RELEASE KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "The existing Sticky & Note release keystore was accepted." >> "$GITHUB_STEP_SUMMARY"

      - name: Set automatic app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon :app:assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sticky & Note v${{ steps.version.outputs.version_name }}
          body: |
            Automatski build za commit ${{ github.sha }}.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
