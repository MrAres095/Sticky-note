name: Build and release signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing STICKY_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing STICKY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing STICKY_KEY_PASSWORD"; exit 1; }
          test "$KEY_ALIAS" = "sticky-notes-release" || { echo "::error::STICKY_KEY_ALIAS must be sticky-notes-release"; exit 1; }

          mkdir -p "$HOME/.android"
          python3 - <<'PY'
          import base64, os
          s = "".join(os.environ["KEYSTORE_B64"].split()).rstrip("=")
          s += "=" * ((4 - len(s) % 4) % 4)
          raw = base64.b64decode(s, validate=True)
          if len(raw) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open(os.path.expanduser("~/.android/sticky-notes-release.jks"), "wb") as f:
              f.write(raw)
          os.chmod(os.path.expanduser("~/.android/sticky-notes-release.jks"), 0o600)
          print("Release keystore decoded.")
          PY

          STORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD_CLEAN="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT_SHA256="$(keytool -list -v -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          test -n "$CERT_SHA256" || { echo "::error::Could not read release certificate fingerprint"; exit 1; }

          {
            echo "storeFile=$HOME/.android/sticky-notes-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD_CLEAN"
          } > keystore.properties
          chmod 600 keystore.properties
          echo "RELEASE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "Release keystore and alias validated."

      - name: Set automatic app version
        id: version
        shell: bash
        run: |
          echo "version_name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon :app:assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

      - name: Verify APK uses the original release certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Release APK was not produced"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_SHA256="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$ACTUAL_SHA256" || { echo "::error::Could not read APK signing certificate"; exit 1; }
          EXPECTED_NORMALIZED="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_NORMALIZED="$(printf '%s' "$ACTUAL_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]; then
            echo "::error::APK signer does not match the original release keystore. Refusing to publish."
            exit 1
          fi
          echo "APK signature verified against the configured release certificate."
          {
            echo "### APK signing verification"
            echo "- Result: passed"
            echo "- Certificate SHA-256: `$RELEASE_CERT_SHA256`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sticky & Note v${{ steps.version.outputs.version_name }}
          body: |
            Automatski build za commit ${{ github.sha }}.
            APK je objavljen tek nakon provjere potpisa originalnim release certifikatom.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
