name: Build and release signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > /tmp/sticky.b64
          B64_LEN=$(wc -c < /tmp/sticky.b64 | tr -d ' ')
          echo "Keystore Base64 length: $B64_LEN"

          SIGNING_MODE="debug-fallback"

          if python3 - <<'PY'
          import base64, os
          s = open("/tmp/sticky.b64").read()
          if not s:
              raise ValueError("empty keystore secret")
          s += "=" * ((4 - len(s) % 4) % 4)
          raw = base64.b64decode(s)
          if len(raw) < 100:
              raise ValueError("decoded keystore is unexpectedly small")
          print("Decoded keystore bytes:", len(raw))
          with open(os.path.expanduser("~/.android/sticky-notes-release.jks"), "wb") as f:
              f.write(raw)
          PY
          then
            echo "Keystore Base64 decode: OK"
          else
            echo "Keystore Base64 decode: FAILED; using debug signing fallback."
            echo "DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          fi

          if [ "${DEBUG_SIGNING:-false}" != "true" ]; then
            echo "Checking keystore password and structure..."
            if keytool -list -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$KEYSTORE_PASSWORD" >/tmp/keytool.out 2>/tmp/keytool.err; then
              echo "Keystore password: OK"
              sed -n '1,12p' /tmp/keytool.out
              if keytool -list -keystore "$HOME/.android/sticky-notes-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                echo "Signing alias: OK"
                SIGNING_MODE="persistent-release-key"
                cat > keystore.properties <<EOF
          storeFile=$HOME/.android/sticky-notes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
              else
                echo "Signing alias: NOT FOUND; using debug signing fallback."
                echo "DEBUG_SIGNING=true" >> "$GITHUB_ENV"
              fi
            else
              echo "Keystore password/open: FAILED; using debug signing fallback."
              sed -n '1,4p' /tmp/keytool.err
              echo "DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            fi
          fi

          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"

      - name: Report signing mode
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.signing_mode }}" = "persistent-release-key" ]; then
            echo "### Signing: PERSISTENT RELEASE KEY" >> "$GITHUB_STEP_SUMMARY"
            echo "The configured Sticky & Note release keystore and alias were accepted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Signing: DEBUG FALLBACK" >> "$GITHUB_STEP_SUMMARY"
            echo "The configured release keystore could not be used; this APK is not suitable for update-over-install compatibility." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set automatic app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon :app:assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sticky & Note v${{ steps.version.outputs.version_name }}
          body: |
            Automatski build za commit ${{ github.sha }}.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
