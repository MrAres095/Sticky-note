name: Build and release signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing key and diagnose secret
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE_B64_CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          export KEYSTORE_B64_CLEAN

          python3 - <<'PY'
          import base64, binascii, os, re, sys
          s = os.environ["KEYSTORE_B64_CLEAN"]
          print("Signing secret diagnostics (secret value is never printed):")
          print(f"- Base64 length: {len(s)}")
          print(f"- Length modulo 4: {len(s) % 4}")
          print(f"- Valid Base64 character set: {bool(re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', s))}")
          try:
              raw = base64.b64decode(s, validate=True)
          except Exception as e:
              print(f"- Base64 decode: FAILED ({type(e).__name__})")
              print(f"- Decode detail: {e}")
              sys.exit(1)
          print("- Base64 decode: OK")
          print(f"- Decoded bytes: {len(raw)}")
          print(f"- JKS magic: {'OK' if raw[:4] == bytes.fromhex('FEEDFEED') else 'FAILED'}")
          print(f"- Last 4 bytes: {raw[-4:].hex().upper()}")
          open(os.path.expanduser("~/.android/sticky-notes-release.jks"), "wb").write(raw)
          PY

          KEYTOOL_LOG=/tmp/sticky-keytool-check.txt
          if ! keytool -list               -keystore "$HOME/.android/sticky-notes-release.jks"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS"               >/tmp/sticky-keytool-out.txt 2>"$KEYTOOL_LOG"; then
            echo "Signing keystore validation FAILED."
            cat "$KEYTOOL_LOG"
            echo "This means the stored Base64 decodes, but the JKS cannot be opened with the configured signing credentials."
            exit 1
          fi

          echo "Signing keystore validation: OK"
          echo "Signing alias validation: OK"

          cat > keystore.properties <<EOF
          storeFile=$HOME/.android/sticky-notes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set automatic app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon :app:assembleRelease             -PversionCode=${{ steps.version.outputs.version_code }}             -PversionName=${{ steps.version.outputs.version_name }}

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sticky & Note v${{ steps.version.outputs.version_name }}
          body: |
            Automatski build za commit ${{ github.sha }}.

            APK je potpisan trajnim signing ključem aplikacije i može se instalirati kao nadogradnja postojeće verzije.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
