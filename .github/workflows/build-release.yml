name: Build and release signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE_B64_CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"

          python3 scripts/recover_jks.py             "$KEYSTORE_B64_CLEAN"             "$KEYSTORE_PASSWORD"             "$HOME/.android/sticky-notes-release.jks"

          keytool -list             -keystore "$HOME/.android/sticky-notes-release.jks"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             >/tmp/sticky-keytool-check.txt 2>&1 || {
              echo "Signing keystore validation failed:"
              cat /tmp/sticky-keytool-check.txt
              exit 1
            }

          cat > keystore.properties <<EOF
          storeFile=$HOME/.android/sticky-notes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set automatic app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon :app:assembleRelease             -PversionCode=${{ steps.version.outputs.version_code }}             -PversionName=${{ steps.version.outputs.version_name }}

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sticky & Note v${{ steps.version.outputs.version_name }}
          body: |
            Automatski build za commit ${{ github.sha }}.

            APK je potpisan trajnim signing ključem aplikacije i može se instalirati kao nadogradnja postojeće verzije.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
