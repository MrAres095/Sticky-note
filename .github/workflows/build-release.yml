name: Build and release signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          python3 - <<'PY'
          import base64, os, re, sys

          raw = os.environ.get("KEYSTORE_B64", "")
          clean = re.sub(r"[^A-Za-z0-9+/=]", "", raw)

          print(
              f"Signing key secret received: raw={len(raw)} chars, "
              f"base64={len(clean)} chars, mod4={len(clean) % 4}"
          )

          if not clean:
              raise SystemExit("Signing key secret is empty.")

          if len(clean) % 4 == 1:
              raise SystemExit(
                  "Signing key secret is incomplete/invalid Base64 "
                  "(length mod 4 = 1)."
              )

          clean += "=" * ((4 - len(clean) % 4) % 4)

          try:
              data = base64.b64decode(clean, validate=True)
          except Exception as exc:
              raise SystemExit(f"Signing key secret is not valid Base64: {exc}")

          path = os.path.expanduser("~/.android/sticky-notes-release.jks")
          with open(path, "wb") as f:
              f.write(data)

          print(f"Decoded signing keystore: {len(data)} bytes")

          if len(data) < 32:
              raise SystemExit("Decoded signing keystore is unexpectedly small.")
          PY

          keytool -list             -keystore "$HOME/.android/sticky-notes-release.jks"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             >/tmp/sticky-keytool-check.txt 2>&1 || {
              echo "Signing keystore validation failed:"
              cat /tmp/sticky-keytool-check.txt
              exit 1
            }

          cat > keystore.properties <<EOF
          storeFile=$HOME/.android/sticky-notes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set automatic app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon :app:assembleRelease             -PversionCode=${{ steps.version.outputs.version_code }}             -PversionName=${{ steps.version.outputs.version_name }}

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sticky & Note v${{ steps.version.outputs.version_name }}
          body: |
            Automatski build za commit ${{ github.sha }}.

            APK je potpisan trajnim signing ključem aplikacije i može se instalirati kao nadogradnja postojeće verzije.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
