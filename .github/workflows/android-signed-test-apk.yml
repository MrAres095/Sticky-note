name: Build signed test APK (no release)

on:
  push:
    branches:
      - feature/notebook-ui-server-ready

permissions:
  contents: read

jobs:
  signed-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate original signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STICKY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STICKY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STICKY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STICKY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing keystore secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing keystore password secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing key password secret"; exit 1; }
          test "$KEY_ALIAS" = "sticky-notes-release" || { echo "Unexpected key alias; refusing to build"; exit 1; }

          mkdir -p "$RUNNER_TEMP/sticky-signing"
          python3 - <<'PY'
          import base64, os
          s = "".join(os.environ["KEYSTORE_B64"].split()).rstrip("=")
          s += "=" * ((4 - len(s) % 4) % 4)
          raw = base64.b64decode(s, validate=True)
          if len(raw) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "sticky-signing", "release.jks"), "wb") as f:
              f.write(raw)
          print("Keystore bytes decoded; contents will not be printed.")
          PY

          STORE_PASS="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASS="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          KS="$RUNNER_TEMP/sticky-signing/release.jks"
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore/password/alias validation failed; refusing to build."
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" >/dev/null 2>&1; then
            echo "Key password validation failed; refusing to build."
            exit 1
          fi
          echo "Original release keystore and alias validated."
          {
            echo "storeFile=$KS"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties
          echo "PERSISTENT_RELEASE_KEY=true" >> "$GITHUB_OUTPUT"
        id: signing

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease -PversionCode=96 -PversionName=1.0.96

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          echo "APK signature verification passed."

      - name: Upload signed test APK (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: sticky-note-signed-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
